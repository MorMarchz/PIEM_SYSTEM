services:
  db:
    image: mysql:8.0
    container_name: piem_mysql_prod
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-piem_db}
      MYSQL_USER: ${MYSQL_USER:-piem_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-piem_password}
    volumes:
      - db_prod_data:/var/lib/mysql
      - ./db/init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - piem_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: piem_backend_prod
    restart: always
    environment:
      PORT: 5001
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-piem_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-piem_password}
      DB_NAME: ${MYSQL_DATABASE:-piem_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_piem_system_2026}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-supersecretrefreshkey_piem_system_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - piem_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: piem_frontend_prod
    restart: always
    depends_on:
      - backend
    networks:
      - piem_prod_net

  nginx:
    image: nginx:alpine
    container_name: piem_nginx_prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - piem_prod_net

networks:
  piem_prod_net:
    driver: bridge

volumes:
  db_prod_data:
